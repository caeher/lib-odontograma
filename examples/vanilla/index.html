<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odontogram — Vanilla Example</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #fafafa;
        color: #333;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p.subtitle {
        color: #666;
        margin-bottom: 1.5rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      button {
        padding: 0.4rem 0.8rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 0.875rem;
      }
      button:hover {
        background: #f0f0f0;
      }
      button.active {
        background: #1976d2;
        color: #fff;
        border-color: #1976d2;
      }
      #odontogram-container {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 1rem;
        min-height: 420px;
      }
      .info {
        margin-top: 1rem;
        padding: 1rem;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 0.875rem;
        font-family: monospace;
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h1>Odontogram Library</h1>
    <p class="subtitle">Stage 03 · SVG & representation — interactive incremental SVG demo</p>

    <div class="toolbar" id="views-toolbar">
      <strong style="align-self: center; font-size: 0.85rem; margin-right: 0.25rem">Views:</strong>
      <button id="btn-permanent" class="active" data-view="permanent">Permanent (32)</button>
      <button id="btn-deciduous" data-view="deciduous">Deciduous (20)</button>
      <button id="btn-mixed" data-view="mixed">Mixed (52)</button>
      <button id="btn-upper" data-view="upper">Upper Arch</button>
      <button id="btn-lower" data-view="lower">Lower Arch</button>
      <button id="btn-q1" data-view="quadrant-1">Q1 (Upper R)</button>
      <button id="btn-q2" data-view="quadrant-2">Q2 (Upper L)</button>
      <button id="btn-q3" data-view="quadrant-3">Q3 (Lower L)</button>
      <button id="btn-q4" data-view="quadrant-4">Q4 (Lower R)</button>
      <button id="btn-t16" data-view="tooth-16">Tooth 16 Detail</button>
      <button id="btn-t55" data-view="tooth-55">Tooth 55 Detail</button>
    </div>

    <div class="toolbar" id="options-toolbar">
      <strong style="align-self: center; font-size: 0.85rem; margin-right: 0.25rem"
        >Options:</strong
      >
      <button id="btn-notation">Notation: FDI</button>
      <label for="ui-locale">Interface language</label>
      <select id="ui-locale" aria-label="Interface language">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <button id="btn-toggle-orientation" class="active">Orientation: ON (R/L)</button>
      <button id="btn-toggle-midline" class="active">Midline: ON</button>
      <button id="btn-filter-anterior">Filter: Anterior (13..23, 33..43)</button>
      <button id="btn-filter-all">Filter: Reset (All)</button>
    </div>

    <div class="toolbar" id="actions-toolbar">
      <strong style="align-self: center; font-size: 0.85rem; margin-right: 0.25rem"
        >Actions:</strong
      >
      <button id="btn-present">Set Present</button>
      <button id="btn-missing">Set Missing</button>
      <button id="btn-unerupted">Set Unerupted</button>
      <label
        >Mark type
        <select id="mark-type">
          <option value="caries">Caries</option>
          <option value="restoration">Restoration</option>
          <option value="crown">Crown</option>
        </select>
      </label>
      <label
        >Status
        <select id="mark-status">
          <option value="existing">Existing</option>
          <option value="planned">Planned</option>
          <option value="completed">Completed</option>
          <option value="proposed">Proposed</option>
        </select>
      </label>
      <button id="btn-add-mark">Apply Mark to Selection</button>
      <button id="btn-edit-mark">Edit Selected Mark</button>
      <button id="btn-delete-mark">Delete Selected Mark</button>
      <button id="btn-add-bridge">Add Bridge (14-16)</button>
      <button id="btn-batch">Batch Demo</button>
      <button id="btn-clear-marks">Clear Marks</button>
    </div>

    <div id="odontogram-container"></div>
    <div class="info" id="log">Ready.</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
